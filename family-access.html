<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Family Access | Songs With Grace</title><link rel="icon" href="assets/favicon.png"><link href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="swg-theme.css?v=20261102"><script defer src="swg-theme.js?v=20261102"></script>
<style>:root{--purple:#65407a;--paper:#fbfaf7;--ink:#29262b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.55 Caladea,Georgia,serif}main{max-width:900px;margin:45px auto;padding:0 20px 60px}h1{color:var(--purple);text-align:center}h2{color:var(--purple)}.panel{background:#fff;border:1px solid #ddd0e5;border-radius:14px;padding:24px;margin:22px 0}label{display:block;margin:12px 0}input{display:block;width:100%;max-width:440px;padding:12px;border:1px solid #a994b6;border-radius:8px;font:inherit}button{background:var(--purple);color:white;border:0;border-radius:8px;padding:11px 22px;font:inherit;cursor:pointer}button:disabled{opacity:.6}#status{min-height:1.5em}iframe{display:block;width:100%;height:75vh;border:1px solid #d8cce0;border-radius:10px;background:white}a{color:var(--purple)}[hidden]{display:none!important}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap}@media(max-width:600px){main{margin:20px auto}.panel{padding:17px}iframe{height:70vh}}</style></head>
<body><main><h1>Family Access</h1><p style="text-align:center">A little corner of Songs With Grace for the Worm Family. 🪱</p>
<section class="panel" id="login-section"><h2>Family sign-in</h2><form id="login"><label>Email address<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="login-button" type="submit">Sign in</button></form></section>
<section class="panel" id="family-section" hidden><div class="controls"><h2 style="margin:0;flex:1">Worm Family Christmas</h2><button id="signout" type="button">Sign out</button></div><p id="file-status">Loading your family newsletter…</p><iframe id="newsletter" title="Worm Family Christmas Newsletter" sandbox="" hidden></iframe></section>
<p id="status" role="status" aria-live="polite"></p><button id="other-signout" type="button" hidden>Sign out of other account</button><p><a href="index.html">Return to Songs With Grace</a></p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://nfsfoxdklaifvdyaaojp.supabase.co','sb_publishable_yGWGY-pkJqSutE-xocFNCg_woQ321hv');
const FAMILY_ID='bf184f84-f833-4171-85a4-38f10a2d44ed';
const BUCKET='family-private';
const FILE='worm-family-christmas.html';
const otherSignout=document.getElementById('other-signout');const loginSection=document.getElementById('login-section'),familySection=document.getElementById('family-section'),status=document.getElementById('status'),fileStatus=document.getElementById('file-status'),newsletter=document.getElementById('newsletter');
let renderVersion=0;
async function render(user){const version=++renderVersion;const allowed=user?.id===FAMILY_ID;loginSection.hidden=!!allowed;familySection.hidden=!allowed;otherSignout.hidden=!user||allowed;newsletter.hidden=true;newsletter.removeAttribute('srcdoc');if(!allowed){if(user){status.textContent='This account is not authorized for Family Access. Please sign out of the other SWG session before using the family login.';}return;}status.textContent='';fileStatus.textContent='Loading your family newsletter…';try{const {data,error}=await supabase.storage.from(BUCKET).download(FILE);if(error||!data)throw error||new Error('File unavailable');const html=await data.text();if(version!==renderVersion)return;const base='<base href="https://madelyndionne.github.io/songs-with-grace/">';newsletter.srcdoc=html.replace(/<head([^>]*)>/i,`<head$1>${base}`);newsletter.hidden=false;fileStatus.textContent='';}catch(e){if(version===renderVersion)fileStatus.textContent='The newsletter is not available yet. Please check that the private file has been uploaded.';}}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('login-button');button.disabled=true;status.textContent='Signing in…';try{const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});document.getElementById('password').value='';if(error)throw error;if(data.user?.id!==FAMILY_ID){await supabase.auth.signOut();throw new Error('This account is not authorized for Family Access.');}await render(data.user);}catch(err){status.textContent=err.message==='This account is not authorized for Family Access.'?err.message:'Sign-in failed. Check the family email address and password.';}finally{button.disabled=false;}});
otherSignout.addEventListener('click',async()=>{const {error}=await supabase.auth.signOut();if(error){status.textContent='Unable to sign out.';return;}await render(null);status.textContent='Signed out. You can now use the family account.';});
document.getElementById('signout').addEventListener('click',async()=>{const {error}=await supabase.auth.signOut();if(error){status.textContent='Unable to sign out. Please try again.';return;}await render(null);status.textContent='Signed out.';});
const {data:{user},error}=await supabase.auth.getUser();if(error)status.textContent='Please sign in.';await render(error?null:user);
</script><script defer src="swg-footer.js"></script></body></html>
